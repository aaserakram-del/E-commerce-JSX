=================================================
useState
=================================================


useState:

أداة في React تستخدم لتخزين البيانات
التي تتغير أثناء تشغيل الصفحة.



State:

يعني حالة أو قيمة محفوظة.


مثال:


const [search, setSearch] = useState("");



search:

القيمة الحالية.



setSearch:

الدالة التي تغير القيمة.



القيمة الأولى:

search


الدالة الثانية:

setSearch



"":

القيمة الابتدائية.






مثال من المشروع:


المستخدم كتب:

Black


نغير:


search = "Black"


عن طريق:


setSearch("Black")



بعد تغيير الـ State:

React يعمل:

Re-render


Re-render:

يعني إعادة رسم الجزء الذي تغير في الصفحة.





=================================================
Input + value + onChange
=================================================



Input:

مكان المستخدم يكتب فيه.



value:

يربط الـ input بالـ State.



مثال:


<input value={search} />



يعني:

قيمة الـ input تأتي من search.






onChange:

حدث يحدث عندما المستخدم يغير القيمة.



مثال:


onChange={(e)=>setSearch(e.target.value)}




e:

Event

يعني الحدث الذي حصل.



target:

العنصر الذي حدث عليه التغيير.



value:

القيمة الموجودة داخله.





الحدث:


المستخدم يكتب

↓

onChange يعمل

↓

نأخذ القيمة

↓

setSearch تغير الـ State

↓

React يعمل Re-render





=================================================
useEffect
=================================================


useEffect:

تستخدم لتنفيذ كود عند حدوث شيء معين.



في مشروعنا استخدمناها لجلب المنتجات.



مثال:


useEffect(()=>{


},[])




[]:

Dependency Array


يعني:

شغل الكود مرة واحدة فقط
عند فتح الصفحة.





الأحداث:


فتح صفحة Shop

↓

useEffect يعمل

↓

axios يطلب المنتجات

↓

البيانات تصل

↓

نخزن البيانات





=================================================
axios + API
=================================================


axios:

مكتبة تستخدم لإرسال طلبات
وجلب البيانات.



API:

رابط يحتوي على بيانات نأخذها.



مثال:


axios.get(url)



get:

يعني أريد جلب بيانات.






Request:

الطلب الذي نرسله للسيرفر.



Response:

الرد الذي يرجع لنا.






مثال:


axios.get(url)

.then((res)=>{


setProducts(res.data)


})




res:

Response


res.data:

البيانات القادمة من API.






الأحداث:


axios يرسل Request

↓

السيرفر يرجع Response

↓

نأخذ البيانات

↓

نضعها في State





=================================================

=================================================


map:

تستخدم لعمل Loop على Array
وعرض البيانات.



مثال:


products.map((product)=>{


})




يعني:


مر على كل المنتجات.






في المشروع:


كل Product

الصورة

العنوان

السعر

التقييم





=================================================
filter()
=================================================


filter:

تستخدم لإنشاء Array جديدة
بها العناصر التي تحقق شرط معين.



مثال:


products.filter((product)=>{


return product.price > 100


})



لو الشرط:

true

المنتج يظهر.



لو:

false

المنتج يختفي.






=================================================
Search Filter
=================================================


الفكرة:

↓

includes():

تبحث هل النص يحتوي على كلمة معينة.



مثال:

=================================================
toLowerCase()
=================================================


تستخدم لتحويل الحروف إلى حروف صغيرة.

BLACK

Black

=================================================
Category Filter
=================================================



لدينا:


category State



مثال:


const [category,setCategory]
=
useState("All")




All:

يعني اعرض كل المنتجات.



عندما المستخدم يختار:


T-Shirts



نغير:


setCategory("T-Shirts")






المقارنة:


product.category === category



يعني:


هل قسم المنتج يساوي الاختيار؟





=================================================
&& AND
=================================================


&& معناها:

و



يعني كل الشروط يجب أن تكون صحيحة.



مثال:


true && true


الناتج:


true





في المشروع:


return matchSearch && matchCategory



يعني:


البحث صحيح

و

القسم صحيح



إذن يظهر المنتج.






=================================================
|| OR
=================================================


|| معناها:

أو



يكفي شرط واحد يكون صحيح.



مثال:


true || false



الناتج:


true





استخدمناها في:


category === "All"
||
product.category === category



يعني:


لو All

أو

القسم مطابق



اعرض المنتج.
